name: Reserve work-order identity

# Reserve a work order's identity: derive set_id from its Set name (else its title)
# and take the Reserved set UUID from the body's Set UUID row when one is recorded,
# minting a UUIDv4 only when none is. Both go to the pinned issue fields, only when
# empty, so bot/human-provided values are preserved. Fulfills #52 ("reserve the UUID
# at discovery"); widened by #78 (Discover) so a work order labelled or typed after it
# was opened, or filed outside the template, is reserved too.
#
# The UUID is reserved only on a workflow_dispatch, which is how Discover runs this
# after its Trading Card API lookup, and the dispatch says what the lookup found:
# api_lookup=found reuses the existing set's UUID (api_set_uuid) and never mints;
# api_lookup=absent mints one for a new set. Issue events fire before that lookup, so
# they reserve set_id (and a body-recorded UUID) only; minting there could pin a fresh
# UUID for a set the API already holds.
#
# The logic lives in .github/scripts/work-order.js.

on:
  issues:
    types: [opened, labeled, typed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Work-order issue number to reserve
        required: true
        type: string
      api_lookup:
        description: What Discover's Trading Card API lookup found (found = the set exists, absent = it is new)
        required: true
        type: choice
        options: [found, absent]
      api_set_uuid:
        description: The existing set's UUID, required when api_lookup is found
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  reserve:
    # On an issue event, only OPEN work orders: the work-order label OR the Work Order
    # issue type, on an issue that is still open (labelling or typing a closed issue
    # must not pin identity fields Discover and the producer would never use). A
    # dispatch is checked inside the script once the issue is fetched.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.state == 'open' &&
       (contains(github.event.issue.labels.*.name, 'work-order') ||
        github.event.issue.type.name == 'Work Order'))
    runs-on: ubuntu-latest
    concurrency:
      group: reserve-work-order-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
          DISPATCH_API_LOOKUP: ${{ inputs.api_lookup }}
          DISPATCH_API_UUID: ${{ inputs.api_set_uuid }}
        with:
          script: |
            const wo = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/work-order.js`);
            const { owner, repo } = context.repo;

            let issue = context.payload.issue;
            let apiLookup = null;
            let apiUuid = null;
            if (context.eventName === 'workflow_dispatch') {
              apiLookup = String(process.env.DISPATCH_API_LOOKUP || '').trim();
              apiUuid = String(process.env.DISPATCH_API_UUID || '').trim() || null;
              if (apiLookup !== 'found' && apiLookup !== 'absent') {
                core.setFailed(`api_lookup must be found or absent, got ${JSON.stringify(apiLookup)}`);
                return;
              }
              const raw = String(process.env.DISPATCH_ISSUE || '').trim();
              if (!/^[1-9][0-9]*$/.test(raw)) {
                core.setFailed(`issue_number must be a positive integer, got ${JSON.stringify(raw)}`);
                return;
              }
              const res = await github.rest.issues.get({ owner, repo, issue_number: Number(raw) });
              issue = res.data;
              if (issue.pull_request) {
                core.setFailed(`#${raw} is a pull request, not a work order.`);
                return;
              }
              if (issue.state !== 'open') {
                core.notice(`#${raw} is not open; nothing to reserve.`);
                return;
              }
            }

            await wo.reserveIdentity({
              github, context, core, issue,
              apiLookup, apiUuid,
            });
