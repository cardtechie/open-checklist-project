name: Changelog fragment

# Every PR adds one changelog.d/<issue>-<type>.md fragment instead of editing
# CHANGELOG.md. Collation happens at release, in release.yml, which commits the
# collated CHANGELOG.md straight back to main. See changelog.d/README.md and
# docs/RELEASING.md.

# merge_group: so a merge queue gets this check's status instead of waiting on
# one that never arrives (#82). A queued group has no pull_request payload, so
# the two PR-diff steps below run on pull_request only; the PR they judged is
# the one in the queue. Validation and the collator tests run on both.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read

jobs:
  fragment:
    runs-on: ubuntu-latest
    # Dependabot PRs carry no issue number to name a fragment after.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require an added fragment
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Files this PR adds relative to the merge base, so a fragment added
          # and later renamed or deleted in the same PR does not count.
          added=$(git diff --name-only --diff-filter=A "$BASE_SHA...$HEAD_SHA" -- changelog.d)
          fragments=$(printf '%s\n' "$added" | grep -E '^changelog\.d/[1-9][0-9]*-(added|changed|fixed|security|removed|deprecated)\.md$' || true)
          if [ -z "$fragments" ]; then
            echo "::error::This PR adds no changelog fragment. Add changelog.d/<issue>-<type>.md (type: added|changed|fixed|security|removed|deprecated). See changelog.d/README.md."
            exit 1
          fi
          printf 'fragment(s) added:\n%s\n' "$fragments"

      # No PR writes CHANGELOG.md. Only the release workflow's commit-back
      # does, and that is a push, not a PR, so there is no exemption here. A
      # hand edit would bypass the fragment convention, and a version heading
      # added by a PR would let the commit-back's resume check mistake it for
      # its own (#82, #98).
      - name: Refuse hand edits to CHANGELOG.md
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- CHANGELOG.md)
          if [ -n "$changed" ]; then
            echo "::error::This PR edits CHANGELOG.md. Only the release workflow writes it; add a changelog.d/ fragment instead. See changelog.d/README.md and docs/RELEASING.md."
            exit 1
          fi
          echo "CHANGELOG.md untouched"

      - name: Validate fragment names and bodies
        run: bash scripts/collate-changelog.sh --check

      - name: Run collator tests
        run: bash scripts/collate-changelog.test.sh

      - name: Run commit-back tests
        run: bash scripts/commit-changelog-back.test.sh
