name: Changelog fragment

# Every PR adds one changelog.d/<issue>-<type>.md fragment instead of editing
# CHANGELOG.md. Collation happens once, post-merge, in collate-changelog.yml.
# See changelog.d/README.md.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fragment:
    runs-on: ubuntu-latest
    # Dependabot PRs carry no issue number to name a fragment after.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # The collate PR (auto/collate-changelog, opened by collate-changelog.yml)
      # consumes fragments rather than adding one, so it is exempt from this
      # step only; the name/body validation and collator tests below still run.
      # The same-repo check stops a fork from claiming the exemption by naming
      # its branch auto/collate-changelog.
      - name: Require an added fragment
        if: >-
          !(github.event.pull_request.head.ref == 'auto/collate-changelog' &&
            github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Files this PR adds relative to the merge base, so a fragment added
          # and later renamed or deleted in the same PR does not count.
          added=$(git diff --name-only --diff-filter=A "$BASE_SHA...$HEAD_SHA" -- changelog.d)
          fragments=$(printf '%s\n' "$added" | grep -E '^changelog\.d/[1-9][0-9]*-(added|changed|fixed|security|removed|deprecated)\.md$' || true)
          if [ -z "$fragments" ]; then
            echo "::error::This PR adds no changelog fragment. Add changelog.d/<issue>-<type>.md (type: added|changed|fixed|security|removed|deprecated). See changelog.d/README.md."
            exit 1
          fi
          printf 'fragment(s) added:\n%s\n' "$fragments"

      # Only the collate PR writes CHANGELOG.md. A hand edit would bypass the
      # fragment convention, and release.yml publishes whatever version
      # heading reaches main, so a version added by any other PR would be an
      # unapproved release (#82). Same exemption as the step above.
      - name: Refuse hand edits to CHANGELOG.md
        if: >-
          !(github.event.pull_request.head.ref == 'auto/collate-changelog' &&
            github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- CHANGELOG.md)
          if [ -n "$changed" ]; then
            echo "::error::This PR edits CHANGELOG.md. Only the collate PR (auto/collate-changelog) writes it, releases included; add a changelog.d/ fragment instead. See changelog.d/README.md and docs/RELEASING.md."
            exit 1
          fi
          echo "CHANGELOG.md untouched"

      - name: Validate fragment names and bodies
        run: bash scripts/collate-changelog.sh --check

      - name: Run collator tests
        run: bash scripts/collate-changelog.test.sh
