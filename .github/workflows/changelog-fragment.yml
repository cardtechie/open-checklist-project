name: Changelog fragment

# Every PR adds one changelog.d/<issue>-<type>.md fragment instead of editing
# CHANGELOG.md. Collation happens once, post-merge, in collate-changelog.yml.
# See changelog.d/README.md.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fragment:
    runs-on: ubuntu-latest
    # Dependabot PRs carry no issue number to name a fragment after.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # The collate PR (auto/collate-changelog, opened by collate-changelog.yml)
      # consumes fragments rather than adding one, so it is exempt from this
      # step only; the name/body validation and collator tests below still run.
      # The same-repo check stops a fork from claiming the exemption by naming
      # its branch auto/collate-changelog.
      - name: Require an added fragment
        if: >-
          !(github.event.pull_request.head.ref == 'auto/collate-changelog' &&
            github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Release PR exemption. A release PR turns [Unreleased] into a
          # versioned section by hand (docs/RELEASING.md), so it adds a
          # `## [X.Y.Z]` heading to CHANGELOG.md and no fragment. It is
          # recognised by that heading, the same one release.yml reads, not by
          # branch name. The heading alone is not trusted, because anyone can
          # add one. The exemption holds only when the transformation really
          # happened: (1) no fragment is pending in the BASE tree, so a PR
          # cannot hide pending fragments by deleting them, (2) none is
          # pending in the head either, (3) the head's first versioned heading
          # (the one release.yml selects) is strict SemVer and was added by
          # this PR, (4) `## [Unreleased]` exists and is empty in the head, and
          # (5) every entry that was under `[Unreleased]` in the base now sits
          # under that new heading. Merge the collate PR first, then update
          # this branch.
          if git diff -U0 "$BASE_SHA...$HEAD_SHA" -- CHANGELOG.md | grep -qE '^\+## \[[0-9]+\.[0-9]+\.[0-9]+\]'; then
            # Same selection and same strict SemVer pattern as release.yml.
            first_version() { sed -nE 's/^## \[([^]]+)\].*/\1/p' | grep -v '^Unreleased$' | head -n 1 || true; }
            section_body() { awk -v h="$1" 'index($0, "## [" h "]") == 1 {f=1; next} f && /^## / {exit} f && NF {print}'; }
            head_changelog=$(git show "$HEAD_SHA:CHANGELOG.md")
            base_changelog=$(git show "$BASE_SHA:CHANGELOG.md" 2>/dev/null || true)
            new_version=$(printf '%s\n' "$head_changelog" | first_version)
            if ! printf '%s' "$new_version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "::error::The first versioned CHANGELOG.md heading ('$new_version') is not strict X.Y.Z, so release.yml would reject it. See docs/RELEASING.md."
              exit 1
            fi
            if printf '%s\n' "$base_changelog" | grep -qF "## [$new_version]"; then
              echo "::error::CHANGELOG.md already has a '## [$new_version]' heading in the base. A release PR must add the new version as the first versioned heading, above the existing ones. See docs/RELEASING.md."
              exit 1
            fi
            if ! printf '%s\n' "$head_changelog" | grep -q '^## \[Unreleased\]'; then
              echo "::error::This release PR removed the '## [Unreleased]' heading. Keep it, emptied. See docs/RELEASING.md."
              exit 1
            fi
            pending_filter='^changelog\.d/(README\.md|\.gitkeep|\.markdownlint\.json)$'
            pending_base=$(git ls-tree -r --name-only "$BASE_SHA" -- changelog.d | grep -vE "$pending_filter" || true)
            pending_head=$(git ls-tree -r --name-only "$HEAD_SHA" -- changelog.d | grep -vE "$pending_filter" || true)
            if [ -n "$pending_base" ] || [ -n "$pending_head" ]; then
              echo "::error::This release PR adds a versioned CHANGELOG.md section while fragments are still pending. Merge the collate PR first, then update this branch. See docs/RELEASING.md."
              printf 'pending fragments (base):\n%s\npending fragments (head):\n%s\n' "$pending_base" "$pending_head"
              exit 1
            fi
            unreleased_body=$(git show "$HEAD_SHA:CHANGELOG.md" | awk '/^## \[Unreleased\]/{f=1;next} f&&/^## /{exit} f&&NF{print}')
            if [ -n "$unreleased_body" ]; then
              echo "::error::This release PR adds a versioned CHANGELOG.md section but leaves entries under [Unreleased]. Move them under the new heading. See docs/RELEASING.md."
              printf '%s\n' "$unreleased_body"
              exit 1
            fi
            # Prove the move: each base [Unreleased] entry must now be present
            # in the new version's section, so deleting the notes fails.
            base_unreleased=$(printf '%s\n' "$base_changelog" | section_body "Unreleased")
            new_section=$(printf '%s\n' "$head_changelog" | section_body "$new_version")
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              if ! printf '%s\n' "$new_section" | grep -qxF -- "$line"; then
                echo "::error::An entry from [Unreleased] is missing under [$new_version]: $line"
                exit 1
              fi
            done <<< "$base_unreleased"
            echo "release PR (versioned CHANGELOG.md section, [Unreleased] entries moved, no fragments pending): fragment requirement does not apply"
            exit 0
          fi
          # Files this PR adds relative to the merge base, so a fragment added
          # and later renamed or deleted in the same PR does not count.
          added=$(git diff --name-only --diff-filter=A "$BASE_SHA...$HEAD_SHA" -- changelog.d)
          fragments=$(printf '%s\n' "$added" | grep -E '^changelog\.d/[1-9][0-9]*-(added|changed|fixed|security|removed|deprecated)\.md$' || true)
          if [ -z "$fragments" ]; then
            echo "::error::This PR adds no changelog fragment. Add changelog.d/<issue>-<type>.md (type: added|changed|fixed|security|removed|deprecated). See changelog.d/README.md."
            exit 1
          fi
          printf 'fragment(s) added:\n%s\n' "$fragments"

      - name: Validate fragment names and bodies
        run: bash scripts/collate-changelog.sh --check

      - name: Run collator tests
        run: bash scripts/collate-changelog.test.sh
