name: Validate Data

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/**/*.yaml'
      - 'schemas/**/*.yaml'
      - 'tools/**'
  # A merge queue event carries no path filter, so the check always reports there
  # (mirrors work-order-tests.yml).
  merge_group:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: pip install pyyaml jsonschema
      - name: Run tool unit tests
        run: python -m unittest discover -s tools/tests
      - name: Run validation
        run: python tools/validate.py
