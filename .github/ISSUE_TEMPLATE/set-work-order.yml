name: "Set work-order"
description: "Register a set that needs a checklist — the discovery-stage work-order."
title: "[Work Order] <Set name>"
labels: ["work-order"]
type: "Work Order"
body:
  - type: markdown
    attributes:
      value: |
        A **work-order** is the moment a set first enters the system: it exists and needs a checklist.
        Keep this light — **only the Set name is required.**

        On submit, automation reserves the set's identity into the pinned issue fields: `set_id`
        (a slug of the name) and a fresh `Reserved set UUID`. You don't type those. Then
        **Discover** finds checklist sources and posts a `<!-- ocp-discover:v1 -->` comment;
        that comment, not this form, is what the producer reads. If you know the
        `Release Date`, set it in the sidebar field. Genre / sport / category are optional here —
        they're set for real at the **Normalize** step (in `set.yaml`).

        For OCP tooling / schema / docs work, use the **Development task** template instead.
  - type: input
    id: set-name
    attributes:
      label: Set name
      description: Human name of the product (e.g. "2026 Bowman"). Everything else is optional.
      placeholder: 2026 Bowman
    validations:
      required: true
  - type: input
    id: manufacturer
    attributes:
      label: Manufacturer (optional)
      placeholder: Topps
    validations:
      required: false
  - type: dropdown
    id: genre
    attributes:
      label: Genre (optional)
      description: Finalized at Normalize. Matches set.yaml `genre`.
      options:
        - Sports
        - TCG
        - Non-Sport
    validations:
      required: false
  - type: input
    id: sport
    attributes:
      label: Sport (optional)
      description: e.g. Baseball. Finalized at Normalize (set.yaml `sports`).
    validations:
      required: false
  - type: input
    id: category
    attributes:
      label: Category (optional)
      description: Subject / franchise / league, e.g. MLB or Pokemon. Finalized at Normalize (set.yaml `category`).
    validations:
      required: false
  - type: textarea
    id: sources
    attributes:
      label: Candidate source URLs (optional)
      description: Where a checklist might be sourced (Beckett, TCDB, BaseballCardpedia, manufacturer, …). One per line. These seed Discover; the producer reads the sources from the Discover comment, not from here.
      placeholder: |
        https://baseballcardpedia.com/index.php/2026_Bowman
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: Anything else — parallels expected, base-less product, split series, ambiguity, etc.
    validations:
      required: false
