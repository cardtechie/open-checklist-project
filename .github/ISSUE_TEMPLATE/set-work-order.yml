name: "Set work-order"
description: "Register a set that needs a checklist — the discovery-stage work-order for the pipeline."
title: "[Work Order] <Set name>"
labels: ["work-order"]
type: "Work Order"
body:
  - type: markdown
    attributes:
      value: |
        A **work-order** is the moment a set first enters the system: it exists and needs a checklist.
        It is filled by a PR that adds the set in **v0.3 manifest form**, and closes when the set is
        published. See the pipeline stages in the design doc (Discover → Source → Normalize → Validate → Consume).

        This is for **sets**. For OCP tooling / schema / docs work, use the **Development task** template instead.

        **Set the pinned issue fields in the sidebar** — `set_id`, `Reserved set UUID` (reserve a UUIDv4
        at discovery; identity is born here and is committed unchanged into `set.yaml`), and `Release Date`.
        The fields below capture the rest into the issue body.
  - type: input
    id: set-name
    attributes:
      label: Set name
      description: Human name of the product (e.g. "2026 Bowman").
      placeholder: 2026 Bowman
    validations:
      required: true
  - type: input
    id: manufacturer
    attributes:
      label: Manufacturer
      placeholder: Topps
    validations:
      required: false
  - type: dropdown
    id: genre
    attributes:
      label: Genre
      description: The broad genre. Matches set.yaml `genre` (Sports / TCG / Non-Sport).
      options:
        - Sports
        - TCG
        - Non-Sport
    validations:
      required: true
  - type: dropdown
    id: sport
    attributes:
      label: Sport
      description: Specific sport, when genre is Sports. Matches set.yaml `sports`.
      options:
        - Baseball
        - Basketball
        - Football
        - Hockey
        - Soccer
        - Golf
        - Boxing
        - Wrestling
        - Tennis
        - Racing
        - MMA
        - Olympics
        - Cricket
        - Lacrosse
        - Pickleball
        - Bowling
        - N/A (non-sport / TCG)
    validations:
      required: false
  - type: input
    id: category
    attributes:
      label: Category
      description: Subject / franchise / league. Matches set.yaml `category` (e.g. MLB, Pokemon).
      placeholder: MLB
    validations:
      required: false
  - type: textarea
    id: sources
    attributes:
      label: Candidate source URLs
      description: Where a checklist might be sourced (Beckett, TCDB, BaseballCardpedia, manufacturer, …). One per line.
      placeholder: |
        https://baseballcardpedia.com/index.php/2026_Bowman
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else — parallels expected, base-less product, split series, ambiguity, etc.
    validations:
      required: false
